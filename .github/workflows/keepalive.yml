name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping unkeyed stats endpoint to prevent Render free-tier sleep
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 10 --retry-all-errors --max-time 180 https://vervana-price-intelligence.onrender.com/api/stats)
          echo "http=$code"
          test "$code" = "200"
