name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.12"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Tests (offline)
        run: uv run pytest

      - name: Risk register is up to date
        run: |
          uv run python scripts/gen_risk_register.py
          git diff --exit-code docs/RISK_REGISTER.md \
            || (echo "RISK_REGISTER.md is stale — run 'make risks' and commit." && exit 1)
