[project]
name = "vervana"
version = "0.0.1"
description = "Vervana price-intelligence and procurement platform for Indian fresh produce (Delhi mandis first)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
vervana = "vervana.cli:app"

[dependency-groups]
# Dev tooling. Installed by `uv sync` (which installs default groups) and in CI.
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vervana"]

# ---------------------------------------------------------------------------
# ruff: single tool for lint + format. Kept close to defaults so a junior dev
# is not fighting exotic rules.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

# ---------------------------------------------------------------------------
# pytest: offline by design (Part 1.5). No network fixtures in the default run.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
