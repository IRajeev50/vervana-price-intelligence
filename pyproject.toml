[project]
name = "vervana"
version = "0.0.1"
description = "Vervana price-intelligence and procurement platform for Indian fresh produce (Delhi mandis first)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.19.2",
    "rapidfuzz>=3.14.6",
    "indic-transliteration>=2.3.82",
    "jellyfish>=1.2.1",
    "psycopg[binary]>=3.1",
    "httpx>=0.28.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.15.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "numbers-parser>=4.19.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
vervana = "vervana.cli:app"

[dependency-groups]
# Dev tooling. Installed by `uv sync` (which installs default groups) and in CI.
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vervana"]

# ---------------------------------------------------------------------------
# ruff: single tool for lint + format. Kept close to defaults so a junior dev
# is not fighting exotic rules.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates verbose create_table calls; line length there is noise.
"migrations/versions/*" = ["E501"]

# ---------------------------------------------------------------------------
# pytest: offline by design (Part 1.5). No network fixtures in the default run.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
